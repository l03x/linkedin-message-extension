{# Inline icons (stroke = currentColor). Usage: {% from "_icons.html" import icon %}{{ icon("sun") }} #}
{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "logo" -%}<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>
{%- elif name == "sun" -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "moon" -%}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif name == "monitor" -%}<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
{%- elif name == "logout" -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>
{%- elif name == "external" -%}<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
{%- elif name == "chevron" -%}<path d="m6 9 6 6 6-6"/>
{%- elif name == "check" -%}<path d="M20 6 9 17l-5-5"/>
{%- elif name == "x" -%}<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "alert" -%}<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
{%- elif name == "info" -%}<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
{%- elif name == "diff" -%}<path d="M12 3v14M5 10h14M5 21h14"/>
{%- elif name == "inbox" -%}<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro theme_switch() -%}
<div class="seg icons" role="group" aria-label="Theme">
  <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">{{ icon("sun") }}<span class="sr-only">Light</span></button>
  <button type="button" data-theme-choice="system" aria-pressed="false" title="Match system">{{ icon("monitor") }}<span class="sr-only">System</span></button>
  <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">{{ icon("moon") }}<span class="sr-only">Dark</span></button>
</div>
{% endmacro %}
