apiVersion: v1
kind: Namespace
metadata:
  name: linkedin-outreach
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: linkedin-outreach
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: linkedin-outreach
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: ghcr.io/l03x/linkedin-message-extension/backend:latest
          ports:
            - containerPort: 8000
              hostPort: 8765
              hostIP: 127.0.0.1
          envFrom:
            - secretRef: { name: backend-env }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data