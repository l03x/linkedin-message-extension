services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      # Localhost only: the extension and dashboard run on this machine.
      - "127.0.0.1:${PORT:-8765}:8000"
    volumes:
      - data:/data
    extra_hosts:
      # Lets the container reach an LLM API running on the host as http://host.docker.internal:<port>.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  data:
